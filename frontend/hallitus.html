<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <title>Hallitus</title>
  <link rel="stylesheet" href="css/tyyli.css" />
</head>
<body>
  <header class="navbar">
    <div class="navbar-left">
      <span class="site-title">Tietojärjestelmäprojekti</span>
    </div>
    <nav class="navbar-right">
      <a href="index.html">Etusivu</a>
      <a href="kansanedustajat.html">Kansanedustajat</a>
      <a href="puolueet.html">Puolueet</a>
      <a href="hallitus.html" class="active">Hallitus</a>
    </nav>
  </header>

  <main class="content">
    <h1>Hallitus</h1>

    <section class="card-grid" id="government-members">
      <article class="card">
        <div class="avatar">Kuva</div>
        <h2>Etunimi Sukunimi</h2>
        <p>Tehtävä: Pääministeri</p>
        <p>Puolue: Esimerkkipuolue</p>
      </article>
      <article class="card">
        <div class="avatar">Kuva</div>
        <h2>Toinen Ministeri</h2>
        <p>Tehtävä: Ministeri</p>
        <p>Puolue: Esimerkkipuolue</p>
      </article>
    </section>
  </main>

  <script >
const mpList = document.getElementById('government-members');

let kansanedustajat = [];



// Hae data backendistä
fetch('http://127.0.0.1:3000/kansanedustajat')
  .then(res => res.json())
  .then(data => {

    kansanedustajat = data;

    const ministerit = kansanedustajat.filter(h => h.minister === true);

    renderKortit(ministerit);
  })
  .catch(err=>alert('Fetch error:', err));

// Luo kortit dynaamisesti
function renderKortit(data) {
  mpList.innerHTML = '';
  data.forEach(mp => {
    const card = document.createElement('div');
    card.className = 'card';
    const osoite='https://users.metropolia.fi/~peterh/edustajakuvat/'

    const kuva = `
      <img
        src="${osoite}${mp.last}-${mp.first}-web-${mp.personNumber}.jpg"
        onerror="this.onerror=null; this.src='default.png';"
        alt="Kuva">
    `;


    card.innerHTML = `
      <div class="avatar">${kuva}</div> <!-- kuvat lisätään myöhemmin -->
      <h2>${mp.first} ${mp.last}</h2>
      <p>Puolue: ${mp.party}</p>
      <p>Vaalipiiri: ${mp.seatNumber}</p>
    `;
    mpList.appendChild(card);
    
  });
}


partySelect.addEventListener('change', () => {
  const puolue = partySelect.value.toLowerCase();
  const filtroidut = puolue === 'kaikki'
    ? kansanedustajat
    : kansanedustajat.filter(mp => mp.party.toLowerCase() === puolue);
  renderKortit(filtroidut);
});

// Aakkosjärjestys
sortAscBtn.addEventListener('click', () => {
  const sorted = [...kansanedustajat].sort((a, b) => a.firstname.localeCompare(b.firstname));
  renderKortit(sorted);
});

sortDescBtn.addEventListener('click', () => {
  const sorted = [...kansanedustajat].sort((a, b) => b.firstname.localeCompare(a.firstname));
  renderKortit(sorted);
}); 

  </script>
</body>
</html>
